<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown → Audio · md-tts</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>🎧 md-tts</h1>
    <div class="topbar-actions">
      <span id="backend-status" class="backend-status" data-state="unknown" title="">
        <span class="dot"></span><span class="label">API</span>
      </span>
      <button id="lang-toggle" type="button" class="btn ghost">EN</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 data-i18n="newConversion"></h2>

      <div id="dropzone" class="dropzone" tabindex="0" role="button">
        <p data-i18n="dropzoneHint"></p>
        <p class="muted small" data-i18n="dropzoneFormats"></p>
        <input id="file-input" type="file" multiple accept=".md,.markdown,.txt" hidden />
      </div>
      <ul id="file-list" class="file-list" hidden></ul>

      <div class="divider"><span data-i18n="or"></span></div>

      <label class="field">
        <span data-i18n="docName"></span>
        <input id="doc-name" type="text" maxlength="60" autocomplete="off" />
      </label>
      <label class="field">
        <span data-i18n="pasteText"></span>
        <textarea id="doc-text" rows="6"></textarea>
      </label>

      <div class="options-grid">
        <label class="field">
          <span data-i18n="engine"></span>
          <select id="engine"></select>
        </label>
        <label class="field">
          <span data-i18n="language"></span>
          <select id="language">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="pauseMs"></span>
          <input id="pause-ms" type="number" value="500" min="0" max="10000" step="50" />
        </label>
        <label class="field">
          <span data-i18n="workers"></span>
          <input id="workers" type="number" value="1" min="1" max="16" />
        </label>
        <label class="field">
          <span data-i18n="device"></span>
          <select id="device">
            <option value="" data-i18n="auto"></option>
            <option value="cpu">cpu</option>
            <option value="cuda">cuda</option>
          </select>
        </label>
      </div>

      <div id="qwen-options" class="qwen-options" hidden>
        <div class="options-grid">
          <label class="field">
            <span data-i18n="qwenModel"></span>
            <select id="qwen-model"></select>
          </label>
          <label class="field" id="qwen-speaker-field">
            <span data-i18n="qwenSpeaker"></span>
            <select id="qwen-speaker"></select>
          </label>
        </div>
        <label class="field" id="qwen-instruct-field" hidden>
          <span id="qwen-instruct-label"></span>
          <textarea id="qwen-instruct" rows="2"></textarea>
          <p id="qwen-instruct-help" class="muted small"></p>
        </label>
        <div id="qwen-clone-box" hidden>
          <label class="field">
            <span data-i18n="qwenRefAudio"></span>
            <div class="ref-audio-row">
              <input id="qwen-ref-file" type="file" accept="audio/*,.mp3,.wav,.ogg,.webm,.m4a" />
              <button id="qwen-record" type="button" class="btn">🎤 <span data-i18n="record"></span></button>
            </div>
            <p class="muted small" data-i18n="qwenRefAudioHelp"></p>
          </label>
          <p id="qwen-ref-status" class="muted small" hidden></p>
          <audio id="qwen-ref-preview" controls preload="metadata" hidden></audio>
          <label class="field">
            <span data-i18n="qwenRefText"></span>
            <textarea id="qwen-ref-text" rows="2"></textarea>
            <p class="muted small" data-i18n="qwenRefTextHelp"></p>
          </label>
        </div>
      </div>

      <p id="form-error" class="error" hidden></p>
      <button id="submit" type="button" class="btn primary"><span data-i18n="convert"></span></button>
    </section>

    <section class="card">
      <h2 data-i18n="jobs"></h2>
      <ul id="job-list" class="job-list"></ul>
      <p id="empty-jobs" class="muted" data-i18n="noJobs"></p>
    </section>
  </main>

  <footer class="footer">md-tts</footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
